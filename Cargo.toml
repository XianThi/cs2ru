[package]
name = "cs2ru"
version = "0.1.0"
edition = "2024"
[dependencies]
sysmemkit = {path ="../sysmemkit"}
overlay = { path = "./src/overlay" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rodio = "0.17"
imgui = "0.12.0"
imgui-winit-support = "0.13.0"
winit = "0.30.13"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging"] }
obfstr = "0.4.4"
libloading = "0.9.0"
serde_json = "1.0.154"
ureq = "2.10"
